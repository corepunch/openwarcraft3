name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  prepare-linux-image:
    name: Prepare Linux CI image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      dockerfile_changed: ${{ steps.ci-image.outputs.changed }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: .github/docker/ci/Dockerfile
          sparse-checkout-cone-mode: false

      - name: Check whether the CI Dockerfile changed
        id: ci-image
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || true)"
          fi

          changed=false
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            changed=true
          elif ! git diff --quiet "$base" "$GITHUB_SHA" -- .github/docker/ci/Dockerfile; then
            changed=true
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Build CI image
        if: steps.ci-image.outputs.changed == 'true'
        run: |
          docker build --pull \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag ghcr.io/corepunch/open-realm-ci:ubuntu-24.04 \
            .github/docker/ci

      - name: Expand checkout for Dockerfile pull request validation
        if: >-
          steps.ci-image.outputs.changed == 'true' &&
          github.event_name == 'pull_request'
        run: git sparse-checkout disable

      - name: Run unit tests in candidate image
        if: >-
          steps.ci-image.outputs.changed == 'true' &&
          github.event_name == 'pull_request'
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            ghcr.io/corepunch/open-realm-ci:ubuntu-24.04 \
            make test

      - name: Prepare JUnit artifact from candidate image
        if: >-
          !cancelled() &&
          steps.ci-image.outputs.changed == 'true' &&
          github.event_name == 'pull_request'
        run: |
          mkdir -p build/tests/junit
          printf 'workflow_run=%s\nhead_sha=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" > build/tests/junit/run-info.txt

      - name: Upload JUnit reports from candidate image
        if: >-
          !cancelled() &&
          steps.ci-image.outputs.changed == 'true' &&
          github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-test-results
          path: build/tests/junit/
          if-no-files-found: error
          retention-days: 7

      - name: Build in candidate image
        if: >-
          steps.ci-image.outputs.changed == 'true' &&
          github.event_name == 'pull_request'
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            ghcr.io/corepunch/open-realm-ci:ubuntu-24.04 \
            make

      - name: Upload candidate Linux build artifacts
        if: >-
          steps.ci-image.outputs.changed == 'true' &&
          github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: openwarcraft3-linux-x64
          path: |
            build/bin/openwarcraft3
            build/lib/
            build/share/
          if-no-files-found: error

      - name: Log in to GitHub Container Registry
        if: >-
          steps.ci-image.outputs.changed == 'true' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish CI image
        if: >-
          steps.ci-image.outputs.changed == 'true' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/corepunch/open-realm-ci:ubuntu-24.04

  test:
    needs: prepare-linux-image
    if: >-
      !(github.event_name == 'pull_request' &&
        needs.prepare-linux-image.outputs.dockerfile_changed == 'true')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/corepunch/open-realm-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: make test

      - name: Prepare JUnit artifact
        if: ${{ !cancelled() }}
        run: |
          mkdir -p build/tests/junit
          printf 'workflow_run=%s\nhead_sha=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" > build/tests/junit/run-info.txt

      - name: Upload JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-test-results
          path: build/tests/junit/
          if-no-files-found: error
          retention-days: 7

  build:
    needs: prepare-linux-image
    if: >-
      !(github.event_name == 'pull_request' &&
        needs.prepare-linux-image.outputs.dockerfile_changed == 'true')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/corepunch/open-realm-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwarcraft3-linux-x64
          path: |
            build/bin/openwarcraft3
            build/lib/
            build/share/
          if-no-files-found: error
  build-windows:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-libepoxy
            make

      - name: Build
        shell: msys2 {0}
        run: make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwarcraft3-windows-x64
          path: |
            build/bin/openwarcraft3.exe
            build/lib/
            build/share/
          if-no-files-found: error

  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    needs:
      - prepare-linux-image
      - test
      - build
      - build-windows
    if: >-
      always() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/') &&
      needs.build-windows.result == 'success' &&
      needs.test.result == 'success' &&
      needs.build.result == 'success'
    permissions:
      contents: read
    container:
      # Official Flathub CI image matching the manifest runtime/SDK.
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Flatpak output directory
        run: mkdir -p build

      - name: Build Flatpak bundle
        # flatpak-github-actions v6.8, pinned to its immutable release commit.
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3
        with:
          manifest-path: dist-scripts/flathub/io.github.corepunch.OpenRealm.yml
          bundle: build/io.github.corepunch.OpenRealm.flatpak
          arch: x86_64
          cache: true
          restore-cache: true
          save-cache: true
          upload-artifact: false

      - name: Upload Flatpak build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openrealm-flatpak-linux-x64
          path: build/io.github.corepunch.OpenRealm.flatpak
          if-no-files-found: error
          retention-days: 7
