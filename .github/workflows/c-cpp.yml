name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    permissions:
      contents: read

    steps:
      - &linux-dependencies
        name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential git ca-certificates python3 pkg-config \
            libgles2-mesa-dev libsdl2-dev libjpeg-dev zlib1g-dev

      - uses: actions/checkout@v4

      - name: Run unit tests
        run: make test

      - name: Prepare JUnit artifact
        if: ${{ !cancelled() }}
        run: |
          mkdir -p build/tests/junit
          printf 'workflow_run=%s\nhead_sha=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" > build/tests/junit/run-info.txt

      - name: Upload JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-test-results
          path: build/tests/junit/
          if-no-files-found: error
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    container: ubuntu:24.04

    steps:
      - *linux-dependencies

      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwarcraft3-linux-x64
          path: |
            build/bin/openwarcraft3
            build/lib/
            build/share/
          if-no-files-found: error
