name: Refresh Linux CI Image

on:
  schedule:
    # Refresh daily so the image picks up Ubuntu base and APT security updates.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  refresh:
    name: Rebuild Linux CI image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Rebuild CI image with current security updates
        run: |
          docker build \
            --pull \
            --no-cache \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag ghcr.io/corepunch/open-realm-ci:ubuntu-24.04 \
            .github/docker/ci

      - name: Publish CI image
        run: docker push ghcr.io/corepunch/open-realm-ci:ubuntu-24.04
